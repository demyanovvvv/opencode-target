name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (for example 0.1.2). Must match package.json.
        required: true
        type: string
      dry_run:
        description: Build and verify only; skip artifact upload and GitHub release.
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    strategy:
      matrix:
        node-version: [22]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify requested version matches package.json
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node -e "const p=require('./package.json'); if (p.version !== process.env.REQUESTED_VERSION) { console.error('package.json version ' + p.version + ' does not match requested ' + process.env.REQUESTED_VERSION); process.exit(1) }"
      - name: Run checks
        run: npm run check
      - name: Run release checks
        run: npm run release:check
      - name: Build release archive
        run: npm pack
      - name: Upload release archive
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: opencode-target-${{ inputs.version }}
          path: "*.tgz"
          if-no-files-found: error
      - name: Extract release notes from changelog
        if: ${{ !inputs.dry_run }}
        run: node scripts/extract-changelog.mjs "${{ inputs.version }}" release-notes.md
      - name: Publish GitHub release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          body_path: release-notes.md
          files: "*.tgz"
          fail_on_unmatched_files: true
          make_latest: true
